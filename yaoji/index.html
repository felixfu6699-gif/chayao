<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>药记</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>药记</h1>
    <div class="subtitle">MEDICATION TRACKER</div>
  </div>

  <!-- Today -->
  <div id="page-today" class="page active">
    <div class="today-date" id="today-date"></div>
    <div class="today-progress" id="today-progress">--</div>
    <div class="today-status" id="today-status"></div>
    <div id="today-content"></div>
  </div>

  <!-- Meds -->
  <div id="page-meds" class="page">
    <div id="meds-list"></div>
    <button class="fab" onclick="openModal()">+</button>
  </div>

  <!-- History -->
  <div id="page-history" class="page">
    <div class="streak-badge">
      <span class="streak-num" id="streak-num">0</span>
      <span class="streak-text">天连续</span>
    </div>
    <div class="calendar-header">
      <button onclick="prevMonth()">&#8249;</button>
      <h2 id="cal-month-title"></h2>
      <button onclick="nextMonth()">&#8250;</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="calendar-grid" id="cal-grid"></div>
    <div id="day-detail"></div>
  </div>

  <!-- Nav -->
  <nav class="nav">
    <button class="nav-item active" data-page="today" onclick="switchPage('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>今日</span>
    </button>
    <button class="nav-item" data-page="meds" onclick="switchPage('meds')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="12" y1="7" x2="12" y2="13"/></svg>
      <span>药物</span>
    </button>
    <button class="nav-item" data-page="history" onclick="switchPage('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>记录</span>
    </button>
  </nav>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">添加药物</h2>
      <div class="form-group">
        <label>药物名称</label>
        <input type="text" id="input-name" placeholder="如：阿莫西林">
      </div>
      <div class="form-group">
        <label>剂量</label>
        <input type="text" id="input-dosage" placeholder="如：1片 / 5ml">
      </div>
      <div class="form-group">
        <label>服用时段</label>
        <div class="time-slots">
          <div class="time-slot" data-slot="morning" onclick="toggleSlot(this)">早</div>
          <div class="time-slot" data-slot="noon" onclick="toggleSlot(this)">午</div>
          <div class="time-slot" data-slot="evening" onclick="toggleSlot(this)">晚</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-confirm" onclick="saveMed()">保存</button>
      </div>
    </div>
  </div>

  <!-- Confirm -->
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <p>确认删除该药物？<br>相关记录将一并清除</p>
      <div class="btns">
        <button class="btn-cancel" onclick="cancelDelete()">取消</button>
        <button class="btn-confirm" onclick="doDelete()">删除</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>药记</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1a2e2a">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --white: #FFFFFF;
  --bg: #faf9f7;
  --card-bg: #FFFFFF;
  --warm-gray: #f5f3f0;
  --border: #eae6e1;
  --text-primary: #1a2e2a;
  --text-secondary: #5a6b66;
  --text-tertiary: #9ca8a3;
  --brand-primary: #d4875c;
  --brand-primary-light: #fdf5f0;
  --brand-primary-border: #f0cdb8;
  --brand-dark: #1a2e2a;
  --brand-dark-light: #e8f0ee;
  --accent-green: #3d8b6e;
  --accent-green-light: #edf7f3;
  --accent-green-border: #b8dece;
  --accent-red: #c75a4a;
  --accent-red-light: #fdf2f0;
  --accent-red-border: #f0c4bc;
  --accent-orange: #c9953e;
  --accent-orange-light: #fdf8ee;
  --accent-orange-border: #ecd9a8;
  --shadow-sm: 0 1px 3px rgba(26,46,42,0.04), 0 1px 2px rgba(26,46,42,0.06);
  --shadow-md: 0 4px 12px rgba(26,46,42,0.06), 0 2px 4px rgba(26,46,42,0.04);
  --radius-lg: 16px;
  --radius-md: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  padding-bottom: 80px;
  -webkit-tap-highlight-color: transparent;
  font-weight: 400;
  letter-spacing: 0.01em;
}

/* Header - Brand Identity */
.header {
  background: linear-gradient(135deg, var(--brand-dark) 0%, #2a4a44 100%);
  padding: 52px 28px 28px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -30px; right: -20px;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(212,135,92,0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 30%;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(212,135,92,0.08) 0%, transparent 70%);
  border-radius: 50%;
}
.header-content {
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 1;
}
.brand-logo {
  width: 42px; height: 42px;
  position: relative;
  flex-shrink: 0;
}
.brand-logo svg {
  width: 100%; height: 100%;
}
.header-text h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--white);
  margin-bottom: 2px;
}
.header-text .subtitle {
  font-size: 10px;
  font-weight: 400;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* Nav */
.nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--white);
  display: flex;
  border-top: 1px solid var(--border);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: 0 -2px 12px rgba(26,46,42,0.04);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0 8px;
  cursor: pointer;
  border: none;
  background: none;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  transition: all 0.2s;
  position: relative;
}
.nav-item.active { color: var(--brand-primary); font-weight: 600; }
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 20px; height: 2.5px;
  background: var(--brand-primary);
  border-radius: 0 0 2px 2px;
}
.nav-item svg { width: 22px; height: 22px; margin-bottom: 3px; stroke-width: 1.6; }

/* Pages */
.page { display: none; padding: 24px 20px; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* Today */
.today-summary {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.today-date {
  font-size: 13px; font-weight: 400; color: var(--text-tertiary);
  margin-bottom: 12px; letter-spacing: 0.04em;
}
.today-progress {
  font-size: 48px; font-weight: 700; color: var(--brand-dark);
  margin-bottom: 4px; letter-spacing: -0.02em;
  line-height: 1;
}
.today-status {
  font-size: 13px; font-weight: 400; color: var(--text-secondary);
  letter-spacing: 0.02em;
}
.time-section { margin-bottom: 16px; }
.time-section-title {
  font-size: 11px; font-weight: 600; color: var(--text-tertiary);
  letter-spacing: 0.14em; margin-bottom: 10px;
  padding: 0 4px;
  text-transform: uppercase;
}
.med-card {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.med-card:active { transform: scale(0.98); }
.med-card .med-info { flex: 1; }
.med-card .med-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; color: var(--text-primary); }
.med-card .med-detail { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }
.med-card .med-time-stamp { font-size: 11px; color: var(--accent-green); margin-top: 4px; font-weight: 500; letter-spacing: 0.02em; }

.take-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--white);
  color: var(--text-tertiary); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); flex-shrink: 0; margin-left: 14px;
}
.take-btn svg { width: 18px; height: 18px; }
.take-btn span { font-size: 9px; font-weight: 500; letter-spacing: 0.02em; margin-top: 1px; }
.take-btn:active { transform: scale(0.9); }
.take-btn.taken {
  border-color: var(--accent-green);
  background: var(--accent-green);
  color: var(--white);
  box-shadow: 0 2px 8px rgba(61,139,110,0.25);
}

.empty-state { text-align: center; padding: 60px 20px; }
.empty-state p { font-size: 14px; font-weight: 400; color: var(--text-tertiary); margin-bottom: 24px; line-height: 1.6; }
.empty-state .add-btn {
  display: inline-block; background: var(--brand-primary); color: var(--white);
  padding: 14px 36px; border-radius: 28px; font-size: 13px; font-weight: 500;
  letter-spacing: 0.06em; cursor: pointer; border: none;
  box-shadow: 0 4px 12px rgba(212,135,92,0.3);
  transition: all 0.2s;
}
.empty-state .add-btn:active { transform: scale(0.96); }

/* Meds list */
.med-list-item {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 18px 18px;
  margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.med-list-item .info h3 { font-size: 15px; font-weight: 500; margin-bottom: 3px; color: var(--text-primary); }
.med-list-item .info p { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }
.med-list-item .actions { display: flex; gap: 8px; }
.med-list-item .actions button {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--white);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); transition: all 0.2s;
}
.med-list-item .actions button:active { transform: scale(0.9); }
.med-list-item .actions button.danger { color: var(--accent-red); border-color: var(--accent-red-border); }

.fab {
  position: fixed; bottom: 96px; right: 24px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--brand-primary); color: var(--white); border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 300; z-index: 50;
  box-shadow: 0 4px 16px rgba(212,135,92,0.35);
  transition: all 0.2s;
}
.fab:active { transform: scale(0.9); }

/* History */
.streak-badge {
  background: linear-gradient(135deg, var(--brand-primary) 0%, #e6a07a 100%);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex; align-items: baseline; gap: 8px;
  box-shadow: 0 4px 16px rgba(212,135,92,0.2);
}
.streak-badge .streak-num { font-size: 40px; font-weight: 700; color: var(--white); line-height: 1; }
.streak-badge .streak-text { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.8); }

.calendar-container {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.calendar-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.calendar-header h2 { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; color: var(--text-primary); }
.calendar-header button {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--white);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
  transition: all 0.2s;
}
.calendar-header button:active { transform: scale(0.9); }
.calendar-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  text-align: center; margin-bottom: 8px;
  font-size: 11px; font-weight: 500; color: var(--text-tertiary); letter-spacing: 0.04em;
}
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-size: 13px; font-weight: 400;
  cursor: pointer; transition: all 0.2s; color: var(--text-primary);
}
.cal-day.today { font-weight: 700; border: 2px solid var(--brand-primary); color: var(--brand-primary); }
.cal-day.full { background: var(--accent-green); color: var(--white); font-weight: 500; }
.cal-day.partial { background: var(--accent-orange-light); border: 1.5px solid var(--accent-orange-border); color: var(--accent-orange); font-weight: 500; }
.cal-day.none { background: var(--accent-red-light); border: 1.5px solid var(--accent-red-border); color: var(--accent-red); }
.cal-day.selected { box-shadow: 0 0 0 2.5px var(--brand-primary); }
.cal-day.empty { cursor: default; }

.day-detail {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.detail-title { font-size: 12px; font-weight: 600; color: var(--text-tertiary); margin-bottom: 14px; letter-spacing: 0.06em; }
.detail-item {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid var(--warm-gray); font-size: 13px;
}
.detail-item:last-child { border-bottom: none; }
.detail-status { width: 26px; text-align: center; margin-right: 12px; font-weight: 500; font-size: 14px; }
.detail-status.taken { color: var(--accent-green); }
.detail-status.missed { color: var(--text-tertiary); }
.detail-info { flex: 1; }
.detail-slot { color: var(--text-tertiary); margin-right: 8px; font-size: 11px; letter-spacing: 0.04em; font-weight: 500; }
.detail-name { font-weight: 500; color: var(--text-primary); }
.detail-time { font-size: 11px; color: var(--text-tertiary); font-weight: 400; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(26,46,42,0.3); z-index: 200;
  align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--white); border-radius: 24px 24px 0 0;
  padding: 32px 24px 36px; width: 100%; max-width: 500px;
  max-height: 80vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h2 { font-size: 17px; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 28px; text-align: center; color: var(--text-primary); }
.form-group { margin-bottom: 22px; }
.form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-tertiary); margin-bottom: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
.form-group input {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-md);
  font-size: 15px; font-weight: 400; outline: none; background: var(--warm-gray); letter-spacing: 0.01em;
  transition: all 0.2s;
}
.form-group input:focus { border-color: var(--brand-primary); background: var(--white); box-shadow: 0 0 0 3px rgba(212,135,92,0.1); }
.form-group input::placeholder { color: var(--text-tertiary); font-weight: 300; }
.time-slots { display: flex; gap: 10px; }
.time-slot {
  padding: 11px 24px; border: 1.5px solid var(--border); border-radius: 24px;
  cursor: pointer; font-size: 14px; font-weight: 400; background: var(--white);
  color: var(--text-secondary); letter-spacing: 0.04em; transition: all 0.2s;
}
.time-slot.selected { border-color: var(--brand-primary); background: var(--brand-primary); color: var(--white); font-weight: 600; }
.modal-actions { display: flex; gap: 12px; margin-top: 28px; }
.modal-actions button {
  flex: 1; padding: 15px; border-radius: 28px; border: none;
  font-size: 14px; font-weight: 500; cursor: pointer; letter-spacing: 0.04em;
  transition: all 0.2s;
}
.btn-cancel { background: var(--warm-gray); color: var(--text-secondary); }
.btn-confirm { background: var(--brand-primary); color: var(--white); box-shadow: 0 2px 8px rgba(212,135,92,0.25); }
.btn-confirm:active { transform: scale(0.97); }

/* Toast & Confirm */
.toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--brand-dark); color: var(--white);
  padding: 14px 28px; border-radius: 12px; font-size: 13px; font-weight: 500;
  letter-spacing: 0.04em; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  box-shadow: var(--shadow-md);
}
.toast.show { opacity: 1; }

.confirm-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(26,46,42,0.3); z-index: 250;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.confirm-overlay.show { display: flex; }
.confirm-box { background: var(--white); border-radius: 20px; padding: 28px; width: 280px; text-align: center; box-shadow: var(--shadow-md); }
.confirm-box p { font-size: 14px; font-weight: 400; margin-bottom: 24px; line-height: 1.6; color: var(--text-primary); }
.confirm-box .btns { display: flex; gap: 10px; }
.confirm-box .btns button { flex: 1; padding: 12px; border-radius: 24px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; letter-spacing: 0.02em; }

  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div class="brand-logo">
        <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="4" width="26" height="34" rx="13" stroke="rgba(255,255,255,0.9)" stroke-width="2" fill="none"/>
          <line x1="8" y1="21" x2="34" y2="21" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
          <path d="M21 4C14.4 4 9 9.4 9 16v5h24v-5c0-6.6-5.4-12-12-12z" fill="rgba(212,135,92,0.6)"/>
          <circle cx="16" cy="28" r="1.5" fill="rgba(255,255,255,0.7)"/>
          <circle cx="21" cy="28" r="1.5" fill="rgba(255,255,255,0.7)"/>
          <circle cx="26" cy="28" r="1.5" fill="rgba(255,255,255,0.7)"/>
          <circle cx="16" cy="33" r="1.5" fill="rgba(255,255,255,0.4)"/>
          <circle cx="21" cy="33" r="1.5" fill="rgba(255,255,255,0.7)"/>
          <circle cx="26" cy="33" r="1.5" fill="rgba(255,255,255,0.4)"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>药记</h1>
        <div class="subtitle">MEDICATION TRACKER</div>
      </div>
    </div>
  </div>
  <div id="page-today" class="page active">
    <div class="today-summary">
      <div class="today-date" id="today-date"></div>
      <div class="today-progress" id="today-progress">--</div>
      <div class="today-status" id="today-status"></div>
    </div>
    <div id="today-content"></div>
  </div>
  <div id="page-meds" class="page">
    <div id="meds-list"></div>
    <button class="fab" onclick="openModal()">+</button>
  </div>
  <div id="page-history" class="page">
    <div class="streak-badge">
      <span class="streak-num" id="streak-num">0</span>
      <span class="streak-text">天连续服药</span>
    </div>
    <div class="calendar-container">
      <div class="calendar-header">
        <button onclick="prevMonth()">&#8249;</button>
        <h2 id="cal-month-title"></h2>
        <button onclick="nextMonth()">&#8250;</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-grid" id="cal-grid"></div>
    </div>
    <div id="day-detail"></div>
  </div>
  <nav class="nav">
    <button class="nav-item active" data-page="today" onclick="switchPage('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 13.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>今日</span>
    </button>
    <button class="nav-item" data-page="meds" onclick="switchPage('meds')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="7" y="3" width="10" height="18" rx="5" stroke-linecap="round"/><line x1="7" y1="12" x2="17" y2="12" stroke-linecap="round"/></svg>
      <span>药物</span>
    </button>
    <button class="nav-item" data-page="history" onclick="switchPage('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="5" width="16" height="16" rx="2" stroke-linecap="round"/><line x1="15" y1="3" x2="15" y2="7" stroke-linecap="round"/><line x1="9" y1="3" x2="9" y2="7" stroke-linecap="round"/><line x1="4" y1="10" x2="20" y2="10" stroke-linecap="round"/></svg>
      <span>记录</span>
    </button>
  </nav>
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">添加药物</h2>
      <div class="form-group">
        <label>药物名称</label>
        <input type="text" id="input-name" placeholder="如：阿莫西林">
      </div>
      <div class="form-group">
        <label>剂量</label>
        <input type="text" id="input-dosage" placeholder="如：1片 / 5ml">
      </div>
      <div class="form-group">
        <label>服用时段</label>
        <div class="time-slots">
          <div class="time-slot" data-slot="morning" onclick="toggleSlot(this)">早</div>
          <div class="time-slot" data-slot="noon" onclick="toggleSlot(this)">午</div>
          <div class="time-slot" data-slot="evening" onclick="toggleSlot(this)">晚</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-confirm" onclick="saveMed()">保存</button>
      </div>
    </div>
  </div>
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <p>确认删除该药物？<br>相关记录将一并清除</p>
      <div class="btns">
        <button class="btn-cancel" onclick="cancelDelete()">取消</button>
        <button class="btn-confirm" onclick="doDelete()">删除</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
// Data
let meds = JSON.parse(localStorage.getItem('yaoji_meds') || '[]');
let records = JSON.parse(localStorage.getItem('yaoji_records') || '{}');
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let selectedDate = null;
let editingId = null;

const SLOTS = { morning: '早', noon: '午', evening: '晚' };

// Utils
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) {
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  return d.getMonth() + 1 + '月' + d.getDate() + '日 周' + days[d.getDay()];
}
function save() {
  localStorage.setItem('yaoji_meds', JSON.stringify(meds));
  localStorage.setItem('yaoji_records', JSON.stringify(records));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1600);
}

// Nav
function switchPage(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector('[data-page="' + page + '"]').classList.add('active');
  if (page === 'today') renderToday();
  else if (page === 'meds') renderMeds();
  else if (page === 'history') renderHistory();
}

// Today page
function renderToday() {
  var today = todayStr();
  var todayMeds = meds.filter(function(m) { return m.active !== false; });
  var container = document.getElementById('today-content');
  var dateEl = document.getElementById('today-date');
  var progressEl = document.getElementById('today-progress');
  var statusEl = document.getElementById('today-status');

  dateEl.textContent = formatDate(new Date());

  if (todayMeds.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>还没有药物，添加你的第一个药物开始记录</p><button class="add-btn" onclick="switchPage(\'meds\');openModal()">添加药物</button></div>';
    progressEl.textContent = '--';
    statusEl.textContent = '';
    return;
  }

  var total = 0, taken = 0;
  todayMeds.forEach(function(m) { m.slots.forEach(function() { total++; }); });
  todayMeds.forEach(function(m) {
    m.slots.forEach(function(s) {
      if (records[today] && records[today][m.id] && records[today][m.id][s]) taken++;
    });
  });

  progressEl.textContent = taken + '/' + total;
  statusEl.textContent = taken === total ? '今日已全部服用' : '还有 ' + (total - taken) + ' 项未服用';

  var html = '';
  var sections = { morning: [], noon: [], evening: [] };
  todayMeds.forEach(function(m) {
    m.slots.forEach(function(s) { sections[s].push(m); });
  });

  Object.keys(sections).forEach(function(slot) {
    if (sections[slot].length === 0) return;
    html += '<div class="time-section"><div class="time-section-title">' + SLOTS[slot] + '</div>';
    sections[slot].forEach(function(m) {
      var isTaken = records[today] && records[today][m.id] && records[today][m.id][slot];
      var timeStamp = isTaken ? records[today][m.id][slot] : '';
      html += '<div class="med-card"><div class="med-info"><div class="med-name">' + m.name + '</div>';
      html += '<div class="med-detail">' + m.dosage + '</div>';
      if (timeStamp) html += '<div class="med-time-stamp">' + timeStamp + ' 已服</div>';
      html += '</div>';
      html += '<button class="take-btn' + (isTaken ? ' taken' : '') + '" onclick="takeMed(\'' + m.id + '\',\'' + slot + '\')">';
      if (isTaken) {
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>';
      } else {
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/></svg>';
        html += '<span>服用</span>';
      }
      html += '</button></div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

function takeMed(medId, slot) {
  var today = todayStr();
  if (!records[today]) records[today] = {};
  if (!records[today][medId]) records[today][medId] = {};

  if (records[today][medId][slot]) {
    delete records[today][medId][slot];
    showToast('已撤销');
  } else {
    var now = new Date();
    records[today][medId][slot] = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    showToast('已记录');
  }
  save(); renderToday();
}

// Meds page
function renderMeds() {
  var container = document.getElementById('meds-list');
  if (meds.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>暂无药物</p></div>';
    return;
  }
  var html = '';
  meds.forEach(function(m) {
    var slotsText = m.slots.map(function(s) { return SLOTS[s]; }).join(' / ');
    html += '<div class="med-list-item"><div class="info"><h3>' + m.name + '</h3>';
    html += '<p>' + m.dosage + ' \u00B7 ' + slotsText + '</p></div>';
    html += '<div class="actions">';
    html += '<button onclick="editMed(\'' + m.id + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';
    html += '<button class="danger" onclick="confirmDelete(\'' + m.id + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

// Modal
function openModal(id) {
  editingId = id || null;
  var overlay = document.getElementById('modal-overlay');
  var title = document.getElementById('modal-title');
  var nameInput = document.getElementById('input-name');
  var dosageInput = document.getElementById('input-dosage');

  document.querySelectorAll('.time-slot').forEach(function(s) { s.classList.remove('selected'); });

  if (id) {
    var m = meds.find(function(x) { return x.id === id; });
    title.textContent = '编辑药物';
    nameInput.value = m.name;
    dosageInput.value = m.dosage;
    m.slots.forEach(function(s) {
      document.querySelector('.time-slot[data-slot="' + s + '"]').classList.add('selected');
    });
  } else {
    title.textContent = '添加药物';
    nameInput.value = '';
    dosageInput.value = '';
  }
  overlay.classList.add('show');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

function toggleSlot(el) { el.classList.toggle('selected'); }

function saveMed() {
  var name = document.getElementById('input-name').value.trim();
  var dosage = document.getElementById('input-dosage').value.trim();
  var slots = [];
  document.querySelectorAll('.time-slot.selected').forEach(function(s) { slots.push(s.dataset.slot); });

  if (!name) { showToast('请输入药物名称'); return; }
  if (slots.length === 0) { showToast('请选择服用时段'); return; }

  if (editingId) {
    var m = meds.find(function(x) { return x.id === editingId; });
    m.name = name; m.dosage = dosage || '按医嘱'; m.slots = slots;
  } else {
    meds.push({ id: genId(), name: name, dosage: dosage || '按医嘱', slots: slots, active: true });
  }
  save(); closeModal(); renderMeds(); showToast(editingId ? '已更新' : '已添加');
}

function editMed(id) { switchPage('meds'); openModal(id); }

function confirmDelete(id) {
  var overlay = document.getElementById('confirm-overlay');
  overlay.classList.add('show');
  overlay.dataset.id = id;
}
function cancelDelete() { document.getElementById('confirm-overlay').classList.remove('show'); }
function doDelete() {
  var id = document.getElementById('confirm-overlay').dataset.id;
  meds = meds.filter(function(m) { return m.id !== id; });
  Object.keys(records).forEach(function(day) { delete records[day][id]; });
  save(); cancelDelete(); renderMeds(); showToast('已删除');
}

// History page
function renderHistory() {
  renderStreak();
  renderCalendar();
}

function renderStreak() {
  var streak = 0;
  var d = new Date(); d.setDate(d.getDate() - 1);
  while (true) {
    var ds = d.toISOString().slice(0, 10);
    if (isDayComplete(ds)) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  if (isDayComplete(todayStr())) streak++;
  document.getElementById('streak-num').textContent = streak;
}

function isDayComplete(dateStr) {
  var activeMeds = meds.filter(function(m) { return m.active !== false; });
  if (activeMeds.length === 0) return false;
  var total = 0, taken = 0;
  activeMeds.forEach(function(m) {
    m.slots.forEach(function(s) {
      total++;
      if (records[dateStr] && records[dateStr][m.id] && records[dateStr][m.id][s]) taken++;
    });
  });
  return total > 0 && taken === total;
}

function getDayStatus(dateStr) {
  var activeMeds = meds.filter(function(m) { return m.active !== false; });
  if (activeMeds.length === 0) return 'empty';
  var total = 0, taken = 0;
  activeMeds.forEach(function(m) {
    m.slots.forEach(function(s) {
      total++;
      if (records[dateStr] && records[dateStr][m.id] && records[dateStr][m.id][s]) taken++;
    });
  });
  if (taken === 0) return 'none';
  if (taken === total) return 'full';
  return 'partial';
}

function renderCalendar() {
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-month-title').textContent = calYear + '年 ' + monthNames[calMonth];

  var first = new Date(calYear, calMonth, 1);
  var lastDay = new Date(calYear, calMonth + 1, 0).getDate();
  var startWeekday = first.getDay();
  var todayS = todayStr();

  var html = '';
  for (var i = 0; i < startWeekday; i++) html += '<div class="cal-day empty"></div>';

  for (var d = 1; d <= lastDay; d++) {
    var ds = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var cls = 'cal-day';
    if (ds === todayS) cls += ' today';
    if (ds <= todayS) {
      var status = getDayStatus(ds);
      if (status !== 'empty') cls += ' ' + status;
    }
    if (ds === selectedDate) cls += ' selected';
    html += '<div class="' + cls + '" onclick="selectDate(\'' + ds + '\')">' + d + '</div>';
  }
  document.getElementById('cal-grid').innerHTML = html;
  renderDayDetail(selectedDate || todayS);
}

function prevMonth() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

function selectDate(ds) { selectedDate = ds; renderCalendar(); }

function renderDayDetail(ds) {
  var container = document.getElementById('day-detail');
  var d = new Date(ds + 'T00:00:00');
  var title = (d.getMonth()+1) + '月' + d.getDate() + '日 详情';
  var activeMeds = meds.filter(function(m) { return m.active !== false; });

  if (activeMeds.length === 0) { container.innerHTML = ''; return; }

  var html = '<div class="day-detail"><div class="detail-title">' + title + '</div>';
  var slotOrder = ['morning','noon','evening'];
  slotOrder.forEach(function(slot) {
    activeMeds.forEach(function(m) {
      if (m.slots.indexOf(slot) === -1) return;
      var isTaken = records[ds] && records[ds][m.id] && records[ds][m.id][slot];
      html += '<div class="detail-item">';
      html += '<div class="detail-status ' + (isTaken ? 'taken' : 'missed') + '">' + (isTaken ? '\u2713' : '\u2013') + '</div>';
      html += '<div class="detail-info"><span class="detail-slot">' + SLOTS[slot] + '</span><span class="detail-name">' + m.name + '</span></div>';
      if (isTaken) html += '<div class="detail-time">' + records[ds][m.id][slot] + '</div>';
      html += '</div>';
    });
  });
  html += '</div>';
  container.innerHTML = html;
}

// Init
document.addEventListener('DOMContentLoaded', function() {
  switchPage('today');
});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>药记</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFFFFF">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --white: #FFFFFF;
  --warm-gray: #f8f7f6;
  --border: #eeece9;
  --text-primary: #2c2c2c;
  --text-secondary: #8a8a8a;
  --text-tertiary: #b5b3b0;
  --accent-green: #7bab8a;
  --accent-green-light: #f3f8f4;
  --accent-green-border: #d0e3d4;
  --accent-red: #c4756a;
  --accent-red-light: #faf3f2;
  --accent-red-border: #e4c4be;
  --accent-orange: #c9a063;
  --accent-orange-light: #fdf8f0;
  --accent-orange-border: #e4d4b4;
  --dark: #2c2c2c;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: var(--white);
  color: var(--text-primary);
  min-height: 100vh;
  padding-bottom: 72px;
  -webkit-tap-highlight-color: transparent;
  font-weight: 300;
  letter-spacing: 0.02em;
}

/* Header */
.header {
  padding: 48px 28px 28px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 20px;
  font-weight: 300;
  letter-spacing: 0.2em;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.header .subtitle {
  font-size: 11px;
  font-weight: 300;
  color: var(--text-tertiary);
  letter-spacing: 0.1em;
}

/* Nav */
.nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--white);
  display: flex;
  border-top: 1px solid var(--border);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 8px;
  cursor: pointer;
  border: none;
  background: none;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.1em;
  color: var(--text-tertiary);
  transition: color 0.2s;
}
.nav-item.active { color: var(--text-primary); font-weight: 400; }
.nav-item svg { width: 20px; height: 20px; margin-bottom: 3px; stroke-width: 1.2; }

/* Pages */
.page { display: none; padding: 28px; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Today */
.today-date {
  font-size: 12px; font-weight: 300; color: var(--text-tertiary);
  margin-bottom: 6px; letter-spacing: 0.08em;
}
.today-progress {
  font-size: 52px; font-weight: 200; color: var(--text-primary);
  margin-bottom: 2px; letter-spacing: -0.02em;
}
.today-status {
  font-size: 12px; font-weight: 300; color: var(--text-secondary);
  margin-bottom: 40px; letter-spacing: 0.06em;
}
.time-section { margin-bottom: 32px; }
.time-section-title {
  font-size: 10px; font-weight: 400; color: var(--text-tertiary);
  letter-spacing: 0.2em; margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.med-card {
  padding: 16px 0;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--warm-gray);
}
.med-card:last-child { border-bottom: none; }
.med-card .med-info { flex: 1; }
.med-card .med-name { font-size: 15px; font-weight: 400; margin-bottom: 2px; }
.med-card .med-detail { font-size: 11px; font-weight: 300; color: var(--text-tertiary); }
.med-card .med-time-stamp { font-size: 10px; color: var(--accent-green); margin-top: 3px; font-weight: 300; letter-spacing: 0.04em; }

.take-btn {
  width: 50px; height: 50px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--white);
  color: var(--text-tertiary); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0; margin-left: 16px;
}
.take-btn svg { width: 16px; height: 16px; }
.take-btn span { font-size: 9px; font-weight: 300; letter-spacing: 0.04em; margin-top: 2px; }
.take-btn:active { transform: scale(0.94); }
.take-btn.taken {
  border-color: var(--accent-green-border);
  background: var(--accent-green-light);
  color: var(--accent-green);
}

.empty-state { text-align: center; padding: 80px 20px; }
.empty-state p { font-size: 13px; font-weight: 300; color: var(--text-tertiary); margin-bottom: 24px; letter-spacing: 0.04em; }
.empty-state .add-btn {
  display: inline-block; background: var(--dark); color: var(--white);
  padding: 13px 32px; border-radius: 24px; font-size: 12px; font-weight: 300;
  letter-spacing: 0.1em; cursor: pointer; border: none;
}

/* Meds list */
.med-list-item {
  padding: 18px 0; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--warm-gray);
}
.med-list-item:last-child { border-bottom: none; }
.med-list-item .info h3 { font-size: 15px; font-weight: 400; margin-bottom: 2px; }
.med-list-item .info p { font-size: 11px; font-weight: 300; color: var(--text-tertiary); }
.med-list-item .actions { display: flex; gap: 10px; }
.med-list-item .actions button {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--white);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.med-list-item .actions button.danger { color: var(--accent-red); border-color: var(--accent-red-border); }

.fab {
  position: fixed; bottom: 84px; right: 28px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--dark); color: var(--white); border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 200; z-index: 50;
}
.fab:active { transform: scale(0.92); }

/* History */
.streak-badge {
  padding: 12px 0 16px; margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; gap: 6px;
}
.streak-badge .streak-num { font-size: 36px; font-weight: 200; }
.streak-badge .streak-text { font-size: 12px; font-weight: 300; color: var(--text-tertiary); }

.calendar-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.calendar-header h2 { font-size: 15px; font-weight: 300; letter-spacing: 0.06em; }
.calendar-header button {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--white);
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
}
.calendar-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  text-align: center; margin-bottom: 6px;
  font-size: 10px; font-weight: 300; color: var(--text-tertiary); letter-spacing: 0.06em;
}
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 24px; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-size: 12px; font-weight: 300;
  cursor: pointer; transition: all 0.2s; color: var(--text-primary);
}
.cal-day.today { font-weight: 500; border: 1.5px solid var(--text-primary); }
.cal-day.full { background: var(--accent-green-light); border: 1px solid var(--accent-green-border); color: var(--accent-green); }
.cal-day.partial { background: var(--accent-orange-light); border: 1px solid var(--accent-orange-border); color: var(--accent-orange); }
.cal-day.none { background: var(--accent-red-light); border: 1px solid var(--accent-red-border); color: var(--accent-red); }
.cal-day.selected { box-shadow: 0 0 0 2px var(--text-primary); }
.cal-day.empty { cursor: default; }

.day-detail { padding-top: 20px; border-top: 1px solid var(--border); }
.detail-title { font-size: 11px; font-weight: 300; color: var(--text-tertiary); margin-bottom: 14px; letter-spacing: 0.06em; }
.detail-item {
  display: flex; align-items: center; padding: 10px 0;
  border-bottom: 1px solid var(--warm-gray); font-size: 13px;
}
.detail-item:last-child { border-bottom: none; }
.detail-status { width: 24px; text-align: center; margin-right: 12px; font-weight: 300; }
.detail-status.taken { color: var(--accent-green); }
.detail-status.missed { color: var(--text-tertiary); }
.detail-info { flex: 1; }
.detail-slot { color: var(--text-tertiary); margin-right: 8px; font-size: 11px; letter-spacing: 0.06em; }
.detail-name { font-weight: 400; }
.detail-time { font-size: 11px; color: var(--text-tertiary); font-weight: 300; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(44,44,44,0.15); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--white); border-radius: 20px 20px 0 0;
  padding: 32px 28px 36px; width: 100%; max-width: 500px;
  max-height: 80vh; overflow-y: auto; animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h2 { font-size: 15px; font-weight: 400; letter-spacing: 0.08em; margin-bottom: 28px; text-align: center; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 10px; font-weight: 400; color: var(--text-tertiary); margin-bottom: 8px; letter-spacing: 0.12em; }
.form-group input {
  width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 300; outline: none; background: transparent; letter-spacing: 0.02em;
}
.form-group input:focus { border-bottom-color: var(--text-primary); }
.form-group input::placeholder { color: var(--text-tertiary); font-weight: 200; }
.time-slots { display: flex; gap: 10px; }
.time-slot {
  padding: 9px 20px; border: 1px solid var(--border); border-radius: 20px;
  cursor: pointer; font-size: 13px; font-weight: 300; background: var(--white);
  color: var(--text-secondary); letter-spacing: 0.06em; transition: all 0.2s;
}
.time-slot.selected { border-color: var(--dark); background: var(--dark); color: var(--white); font-weight: 400; }
.modal-actions { display: flex; gap: 12px; margin-top: 28px; }
.modal-actions button {
  flex: 1; padding: 14px; border-radius: 24px; border: none;
  font-size: 12px; font-weight: 300; cursor: pointer; letter-spacing: 0.08em;
}
.btn-cancel { background: var(--warm-gray); color: var(--text-secondary); }
.btn-confirm { background: var(--dark); color: var(--white); }

/* Toast & Confirm */
.toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--text-primary); color: var(--white);
  padding: 12px 24px; border-radius: 6px; font-size: 12px; font-weight: 300;
  letter-spacing: 0.06em; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

.confirm-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(44,44,44,0.15); z-index: 250;
  align-items: center; justify-content: center;
}
.confirm-overlay.show { display: flex; }
.confirm-box { background: var(--white); border-radius: 16px; padding: 28px; width: 260px; text-align: center; }
.confirm-box p { font-size: 13px; font-weight: 300; margin-bottom: 24px; line-height: 1.6; }
.confirm-box .btns { display: flex; gap: 10px; }
.confirm-box .btns button { flex: 1; padding: 11px; border-radius: 20px; border: none; font-size: 12px; font-weight: 300; cursor: pointer; letter-spacing: 0.04em; }

  </style>
</head>
<body>
  <div class="header">
    <h1>药记</h1>
    <div class="subtitle">MEDICATION TRACKER</div>
  </div>
  <div id="page-today" class="page active">
    <div class="today-date" id="today-date"></div>
    <div class="today-progress" id="today-progress">--</div>
    <div class="today-status" id="today-status"></div>
    <div id="today-content"></div>
  </div>
  <div id="page-meds" class="page">
    <div id="meds-list"></div>
    <button class="fab" onclick="openModal()">+</button>
  </div>
  <div id="page-history" class="page">
    <div class="streak-badge">
      <span class="streak-num" id="streak-num">0</span>
      <span class="streak-text">天连续</span>
    </div>
    <div class="calendar-header">
      <button onclick="prevMonth()">&#8249;</button>
      <h2 id="cal-month-title"></h2>
      <button onclick="nextMonth()">&#8250;</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="calendar-grid" id="cal-grid"></div>
    <div id="day-detail"></div>
  </div>
  <nav class="nav">
    <button class="nav-item active" data-page="today" onclick="switchPage('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>今日</span>
    </button>
    <button class="nav-item" data-page="meds" onclick="switchPage('meds')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="12" y1="7" x2="12" y2="13"/></svg>
      <span>药物</span>
    </button>
    <button class="nav-item" data-page="history" onclick="switchPage('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>记录</span>
    </button>
  </nav>
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">添加药物</h2>
      <div class="form-group">
        <label>药物名称</label>
        <input type="text" id="input-name" placeholder="如：阿莫西林">
      </div>
      <div class="form-group">
        <label>剂量</label>
        <input type="text" id="input-dosage" placeholder="如：1片 / 5ml">
      </div>
      <div class="form-group">
        <label>服用时段</label>
        <div class="time-slots">
          <div class="time-slot" data-slot="morning" onclick="toggleSlot(this)">早</div>
          <div class="time-slot" data-slot="noon" onclick="toggleSlot(this)">午</div>
          <div class="time-slot" data-slot="evening" onclick="toggleSlot(this)">晚</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-confirm" onclick="saveMed()">保存</button>
      </div>
    </div>
  </div>
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <p>确认删除该药物？<br>相关记录将一并清除</p>
      <div class="btns">
        <button class="btn-cancel" onclick="cancelDelete()">取消</button>
        <button class="btn-confirm" onclick="doDelete()">删除</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
// Data
let meds = JSON.parse(localStorage.getItem('yaoji_meds') || '[]');
let records = JSON.parse(localStorage.getItem('yaoji_records') || '{}');
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let selectedDate = null;
let editingId = null;

const SLOTS = { morning: '早', noon: '午', evening: '晚' };

// Utils
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) {
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  return d.getMonth() + 1 + '月' + d.getDate() + '日 周' + days[d.getDay()];
}
function save() {
  localStorage.setItem('yaoji_meds', JSON.stringify(meds));
  localStorage.setItem('yaoji_records', JSON.stringify(records));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

// Nav
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector('[data-page="' + page + '"]').classList.add('active');
  if (page === 'today') renderToday();
  else if (page === 'meds') renderMeds();
  else if (page === 'history') renderHistory();
}

// Today page
function renderToday() {
  const today = todayStr();
  const todayMeds = meds.filter(m => m.active !== false);
  const container = document.getElementById('today-content');
  const dateEl = document.getElementById('today-date');
  const progressEl = document.getElementById('today-progress');
  const statusEl = document.getElementById('today-status');

  dateEl.textContent = formatDate(new Date());

  if (todayMeds.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>还没有药物，添加你的第一个药物开始记录</p><button class="add-btn" onclick="switchPage(\'meds\');openModal()">添加药物</button></div>';
    progressEl.textContent = '--';
    statusEl.textContent = '';
    return;
  }

  let total = 0, taken = 0;
  todayMeds.forEach(m => { m.slots.forEach(() => { total++; }); });
  todayMeds.forEach(m => {
    m.slots.forEach(s => {
      if (records[today] && records[today][m.id] && records[today][m.id][s]) taken++;
    });
  });

  progressEl.textContent = taken + '/' + total;
  statusEl.textContent = taken === total ? '今日已全部服用' : '还有 ' + (total - taken) + ' 项未服用';

  let html = '';
  const sections = { morning: [], noon: [], evening: [] };
  todayMeds.forEach(m => {
    m.slots.forEach(s => { sections[s].push(m); });
  });

  Object.keys(sections).forEach(slot => {
    if (sections[slot].length === 0) return;
    html += '<div class="time-section"><div class="time-section-title">' + SLOTS[slot] + '</div>';
    sections[slot].forEach(m => {
      const isTaken = records[today] && records[today][m.id] && records[today][m.id][slot];
      const timeStamp = isTaken ? records[today][m.id][slot] : '';
      html += '<div class="med-card"><div class="med-info"><div class="med-name">' + m.name + '</div>';
      html += '<div class="med-detail">' + m.dosage + '</div>';
      if (timeStamp) html += '<div class="med-time-stamp">' + timeStamp + ' 已服</div>';
      html += '</div>';
      html += '<button class="take-btn' + (isTaken ? ' taken' : '') + '" onclick="takeMed(\'' + m.id + '\',\'' + slot + '\')">';
      if (isTaken) {
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>';
      } else {
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/></svg>';
        html += '<span>服用</span>';
      }
      html += '</button></div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

function takeMed(medId, slot) {
  const today = todayStr();
  if (!records[today]) records[today] = {};
  if (!records[today][medId]) records[today][medId] = {};

  if (records[today][medId][slot]) {
    delete records[today][medId][slot];
    showToast('已撤销');
  } else {
    const now = new Date();
    records[today][medId][slot] = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    showToast('已记录');
  }
  save(); renderToday();
}

// Meds page
function renderMeds() {
  const container = document.getElementById('meds-list');
  if (meds.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>暂无药物</p></div>';
    return;
  }
  let html = '';
  meds.forEach(m => {
    const slotsText = m.slots.map(s => SLOTS[s]).join(' / ');
    html += '<div class="med-list-item"><div class="info"><h3>' + m.name + '</h3>';
    html += '<p>' + m.dosage + ' \u00B7 ' + slotsText + '</p></div>';
    html += '<div class="actions">';
    html += '<button onclick="editMed(\'' + m.id + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';
    html += '<button class="danger" onclick="confirmDelete(\'' + m.id + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

// Modal
function openModal(id) {
  editingId = id || null;
  const overlay = document.getElementById('modal-overlay');
  const title = document.getElementById('modal-title');
  const nameInput = document.getElementById('input-name');
  const dosageInput = document.getElementById('input-dosage');

  document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));

  if (id) {
    const m = meds.find(x => x.id === id);
    title.textContent = '编辑药物';
    nameInput.value = m.name;
    dosageInput.value = m.dosage;
    m.slots.forEach(s => {
      document.querySelector('.time-slot[data-slot="' + s + '"]').classList.add('selected');
    });
  } else {
    title.textContent = '添加药物';
    nameInput.value = '';
    dosageInput.value = '';
  }
  overlay.classList.add('show');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

function toggleSlot(el) { el.classList.toggle('selected'); }

function saveMed() {
  const name = document.getElementById('input-name').value.trim();
  const dosage = document.getElementById('input-dosage').value.trim();
  const slots = [];
  document.querySelectorAll('.time-slot.selected').forEach(s => slots.push(s.dataset.slot));

  if (!name) { showToast('请输入药物名称'); return; }
  if (slots.length === 0) { showToast('请选择服用时段'); return; }

  if (editingId) {
    const m = meds.find(x => x.id === editingId);
    m.name = name; m.dosage = dosage || '按医嘱'; m.slots = slots;
  } else {
    meds.push({ id: genId(), name, dosage: dosage || '按医嘱', slots, active: true });
  }
  save(); closeModal(); renderMeds(); showToast(editingId ? '已更新' : '已添加');
}

function editMed(id) { switchPage('meds'); openModal(id); }

function confirmDelete(id) {
  const overlay = document.getElementById('confirm-overlay');
  overlay.classList.add('show');
  overlay.dataset.id = id;
}
function cancelDelete() { document.getElementById('confirm-overlay').classList.remove('show'); }
function doDelete() {
  const id = document.getElementById('confirm-overlay').dataset.id;
  meds = meds.filter(m => m.id !== id);
  Object.keys(records).forEach(day => { delete records[day][id]; });
  save(); cancelDelete(); renderMeds(); showToast('已删除');
}

// History page
function renderHistory() {
  renderStreak();
  renderCalendar();
}

function renderStreak() {
  let streak = 0;
  const d = new Date(); d.setDate(d.getDate() - 1);
  while (true) {
    const ds = d.toISOString().slice(0, 10);
    if (isDayComplete(ds)) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  if (isDayComplete(todayStr())) streak++;
  document.getElementById('streak-num').textContent = streak;
}

function isDayComplete(dateStr) {
  const activeMeds = meds.filter(m => m.active !== false);
  if (activeMeds.length === 0) return false;
  let total = 0, taken = 0;
  activeMeds.forEach(m => {
    m.slots.forEach(s => {
      total++;
      if (records[dateStr] && records[dateStr][m.id] && records[dateStr][m.id][s]) taken++;
    });
  });
  return total > 0 && taken === total;
}

function getDayStatus(dateStr) {
  const activeMeds = meds.filter(m => m.active !== false);
  if (activeMeds.length === 0) return 'empty';
  let total = 0, taken = 0;
  activeMeds.forEach(m => {
    m.slots.forEach(s => {
      total++;
      if (records[dateStr] && records[dateStr][m.id] && records[dateStr][m.id][s]) taken++;
    });
  });
  if (taken === 0) return 'none';
  if (taken === total) return 'full';
  return 'partial';
}

function renderCalendar() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-month-title').textContent = calYear + '年 ' + monthNames[calMonth];

  const first = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
  const startWeekday = first.getDay();
  const todayS = todayStr();

  let html = '';
  for (let i = 0; i < startWeekday; i++) html += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= lastDay; d++) {
    const ds = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    let cls = 'cal-day';
    if (ds === todayS) cls += ' today';
    if (ds <= todayS) {
      const status = getDayStatus(ds);
      if (status !== 'empty') cls += ' ' + status;
    }
    if (ds === selectedDate) cls += ' selected';
    html += '<div class="' + cls + '" onclick="selectDate(\'' + ds + '\')">' + d + '</div>';
  }
  document.getElementById('cal-grid').innerHTML = html;
  renderDayDetail(selectedDate || todayS);
}

function prevMonth() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

function selectDate(ds) { selectedDate = ds; renderCalendar(); }

function renderDayDetail(ds) {
  const container = document.getElementById('day-detail');
  const d = new Date(ds + 'T00:00:00');
  const title = (d.getMonth()+1) + '月' + d.getDate() + '日 详情';
  const activeMeds = meds.filter(m => m.active !== false);

  if (activeMeds.length === 0) { container.innerHTML = ''; return; }

  let html = '<div class="detail-title">' + title + '</div>';
  const slotOrder = ['morning','noon','evening'];
  slotOrder.forEach(slot => {
    activeMeds.forEach(m => {
      if (!m.slots.includes(slot)) return;
      const isTaken = records[ds] && records[ds][m.id] && records[ds][m.id][slot];
      html += '<div class="detail-item">';
      html += '<div class="detail-status ' + (isTaken ? 'taken' : 'missed') + '">' + (isTaken ? '\u2713' : '\u2013') + '</div>';
      html += '<div class="detail-info"><span class="detail-slot">' + SLOTS[slot] + '</span><span class="detail-name">' + m.name + '</span></div>';
      if (isTaken) html += '<div class="detail-time">' + records[ds][m.id][slot] + '</div>';
      html += '</div>';
    });
  });
  container.innerHTML = html;
}

// Init
document.addEventListener('DOMContentLoaded', function() {
  switchPage('today');
});

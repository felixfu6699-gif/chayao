<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>药品相互作用查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif;
            background: #ffffff;
            color: #2c2c2c;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            width: 100%;
            padding: 48px 24px 32px;
            text-align: center;
            border-bottom: 1px solid #f0eeec;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #2c2c2c;
            margin-bottom: 12px;
            position: relative;
            display: inline-block;
        }

        .header h1::after {
            content: '';
            position: absolute;
            top: 2px;
            right: -12px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c0564b;
        }

        .header p {
            font-size: 12px;
            font-weight: 300;
            color: #999;
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .input-section {
            margin-bottom: 32px;
        }

        .section-label {
            font-size: 15px;
            font-weight: 400;
            color: #2c2c2c;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-label .capsule {
            display: inline-block;
            width: 18px;
            height: 9px;
            border-radius: 5px;
            background: linear-gradient(90deg, #c0564b 50%, #f5e6d0 50%);
            border: 1px solid #e0dedc;
            position: relative;
            top: 0px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .drug-input {
            flex: 1;
            height: 48px;
            border: none;
            border-bottom: 1px solid #e0dedc;
            padding: 0 4px;
            font-size: 16px;
            font-weight: 300;
            color: #2c2c2c;
            background: transparent;
            outline: none;
            transition: border-color 0.3s ease;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .drug-input::placeholder {
            color: #ccc;
            font-weight: 300;
        }

        .drug-input:focus {
            border-bottom-color: #2c2c2c;
        }

        .btn-add {
            height: 48px;
            padding: 0 20px;
            background: transparent;
            color: #2c2c2c;
            border: 1px solid #2c2c2c;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-add:active {
            background: #2c2c2c;
            color: #fff;
        }

        .camera-section {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-camera, .btn-gallery {
            flex: 1;
            height: 52px;
            border: 1px solid #e8e6e3;
            border-radius: 14px;
            background: #fafaf8;
            color: #666;
            font-size: 12px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .btn-camera:active, .btn-gallery:active {
            border-color: #2c2c2c;
            color: #2c2c2c;
            background: #f5f4f2;
        }

        .btn-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon svg {
            width: 100%;
            height: 100%;
        }

        .drug-list-section {
            margin-bottom: 32px;
            padding-bottom: 32px;
            border-bottom: 1px solid #f0eeec;
        }

        .drug-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 40px;
            align-items: center;
        }

        .drug-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #fafaf8;
            border: 1px solid #eae8e5;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 300;
            color: #2c2c2c;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .drug-tag::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #c4924a;
            flex-shrink: 0;
        }

        .drug-tag .remove {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid #ddd;
            color: #bbb;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
            transition: all 0.2s;
        }

        .drug-tag .remove:active {
            background: #c0564b;
            border-color: #c0564b;
            color: white;
        }

        .empty-hint {
            color: #ccc;
            font-size: 13px;
            font-weight: 300;
            padding: 8px 0;
        }

        .btn-check {
            width: 100%;
            height: 52px;
            background: #2c2c2c;
            color: #fff;
            border: none;
            border-radius: 26px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            cursor: pointer;
            margin-bottom: 32px;
            transition: all 0.2s ease;
            position: relative;
        }

        .btn-check::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #5a9e6f;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-check:not(:disabled)::before {
            opacity: 1;
        }

        .btn-check:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-check:disabled {
            background: #e8e6e3;
            color: #bbb;
            cursor: not-allowed;
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .summary-card {
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 16px;
            border: 1px solid #f0eeec;
        }

        .summary-card.danger-summary {
            background: #fffbfa;
            border-color: #f0e0dc;
        }

        .summary-card.warning-summary {
            background: #fffcf5;
            border-color: #f0e8d8;
        }

        .summary-card.safe-summary {
            background: #f8fcf8;
            border-color: #dceede;
        }

        .summary-card h3 {
            font-size: 14px;
            font-weight: 400;
            color: #2c2c2c;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .summary-card h3::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .danger-summary h3::before {
            background: #c0564b;
        }

        .warning-summary h3::before {
            background: #c4924a;
        }

        .safe-summary h3::before {
            background: #5a9e6f;
        }

        .summary-card p {
            font-size: 13px;
            font-weight: 300;
            color: #666;
            line-height: 1.8;
        }

        .timeline-card {
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 16px;
            background: #fafaf8;
            border: 1px solid #f0eeec;
        }

        .timeline-card h3 {
            font-size: 14px;
            font-weight: 400;
            color: #2c2c2c;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .timeline {
            padding-left: 20px;
            border-left: 1px solid #e0dedc;
        }

        .timeline-item {
            position: relative;
            padding: 10px 0 10px 16px;
            font-size: 13px;
            font-weight: 300;
            color: #555;
            line-height: 1.6;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 16px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2c2c2c;
        }

        .result-item {
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #f0eeec;
            background: #ffffff;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item.danger {
            border-left: 3px solid #c0564b;
            background: #fffbfa;
        }

        .result-item.warning {
            border-left: 3px solid #c4924a;
            background: #fffcf5;
        }

        .result-item.safe {
            border-left: 3px solid #5a9e6f;
            background: #f8fcf8;
        }

        .result-item.info {
            border-left: 3px solid #b0b0b0;
            background: #fafaf8;
        }

        .result-level {
            font-size: 12px;
            font-weight: 400;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .result-item.danger .result-level { color: #c0564b; }
        .result-item.warning .result-level { color: #c4924a; }
        .result-item.safe .result-level { color: #5a9e6f; }
        .result-item.info .result-level { color: #999; }

        .result-drugs {
            font-size: 15px;
            font-weight: 400;
            color: #2c2c2c;
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 13px;
            font-weight: 300;
            color: #666;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .result-advice {
            padding: 16px;
            background: #fafaf8;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 300;
            color: #555;
            line-height: 1.8;
        }

        .result-advice strong {
            font-weight: 400;
            color: #2c2c2c;
        }

        .disclaimer {
            text-align: center;
            font-size: 11px;
            font-weight: 300;
            color: #bbb;
            padding: 40px 16px 24px;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        .pill-icon {
            display: inline-block;
            width: 14px;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, #c0564b 50%, #fafaf8 50%);
            border: 1px solid #e0dedc;
            margin-right: 6px;
            vertical-align: middle;
            position: relative;
            top: -1px;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-box {
            text-align: center;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 1.5px solid #e8e6e3;
            border-top-color: #2c2c2c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 12px;
            font-weight: 300;
            color: #999;
            letter-spacing: 1px;
        }

        .ocr-preview {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #fafaf8;
            border-radius: 12px;
            border: 1px solid #f0eeec;
        }

        .ocr-preview.show {
            display: block;
        }

        .ocr-preview img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .ocr-result-text {
            font-size: 12px;
            font-weight: 300;
            color: #999;
            line-height: 1.6;
        }

        .ocr-drugs-found {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ocr-drug-btn {
            padding: 8px 16px;
            background: transparent;
            color: #2c2c2c;
            border: 1px solid #2c2c2c;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ocr-drug-btn:active {
            background: #2c2c2c;
            color: #fff;
        }

        .drug-tag-alias {
            font-size: 11px;
            color: #999;
            margin-left: 4px;
        }

        .ocr-hint {
            font-size: 12px;
            color: #999;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>这些药能不能一起吃？</h1>
        <p><span class="pill-icon"></span>输入药品名称或拍照，查询是否能同时服用</p>
    </div>

    <div class="container">
        <div class="input-section">
            <div class="section-label">输入药品 <span class="capsule"></span></div>
            <div class="input-row">
                <input type="text" class="drug-input" id="drugInput" placeholder="药品名称，如布洛芬" />
                <button class="btn-add" onclick="addDrug()">添加</button>
            </div>
            <div class="camera-section">
                <button class="btn-camera" onclick="takePhoto()">
                    <span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
                    拍照识别
                </button>
                <button class="btn-gallery" onclick="pickFromGallery()">
                    <span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
                    相册选取
                </button>
            </div>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)" />
            <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleImage(event)" />
            
            <div class="ocr-preview" id="ocrPreview">
                <img id="ocrImage" src="" alt="拍照预览" />
                <div class="ocr-result-text" id="ocrText">正在识别中...</div>
                <div class="ocr-drugs-found" id="ocrDrugs"></div>
            </div>
        </div>

        <div class="drug-list-section">
            <div class="section-label">已添加药品 <span class="capsule"></span></div>
            <div class="drug-tags" id="drugTags">
                <div class="empty-hint">请添加至少两种药品</div>
            </div>
        </div>

        <button class="btn-check" id="btnCheck" onclick="checkInteractions()" disabled>
            查一查能不能一起吃
        </button>

        <div class="result-section" id="resultSection">
        </div>

        <div class="disclaimer">
            本工具仅供参考，不能替代医生或药师的专业建议<br>
            服用多种药品前请咨询医师或药师
        </div>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">正在分析中...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <script>

                {

        let drugList = [];

        function normalizeDrugName(name) {
            name = name.trim();
            if (drugDatabase.aliases[name] !== undefined) {
                return name;
            }
            for (const [generic, brands] of Object.entries(drugDatabase.aliases)) {
                if (brands.some(b => name.includes(b) || b.includes(name))) {
                    return generic;
                }
                if (name.includes(generic)) {
                    return generic;
                }
            }
            return name;
        }

        function addDrug(name) {
            const input = document.getElementById('drugInput');
            const drugName = name || input.value.trim();
            
            if (!drugName) return;
            
            const normalized = normalizeDrugName(drugName);
            
            if (drugList.some(d => d.normalized === normalized)) {
                showToast('该药品已添加');
                input.value = '';
                return;
            }

            drugList.push({
                original: drugName,
                normalized: normalized
            });

            input.value = '';
            renderDrugTags();
            updateCheckButton();
        }

        function removeDrug(index) {
            drugList.splice(index, 1);
            renderDrugTags();
            updateCheckButton();
            if (drugList.length < 2) {
                document.getElementById('resultSection').classList.remove('show');
            }
        }

        function renderDrugTags() {
            const container = document.getElementById('drugTags');
            if (drugList.length === 0) {
                container.innerHTML = '<div class="empty-hint">请添加至少两种药品</div>';
                return;
            }

            container.innerHTML = drugList.map((drug, index) => {
                const showAlias = drug.original !== drug.normalized;
                return '<div class="drug-tag"><span>' + drug.original + (showAlias ? '<span class="drug-tag-alias">(' + drug.normalized + ')</span>' : '') + '</span><span class="remove" onclick="removeDrug(' + index + ')">&#215;</span></div>';
            }).join('');
        }

        function updateCheckButton() {
            const btn = document.getElementById('btnCheck');
            btn.disabled = drugList.length < 2;
        }

        function checkInteractions() {
            if (drugList.length < 2) return;

            showLoading('正在分析药品相互作用...');

            setTimeout(function() {
                const results = analyzeInteractions();
                displayResults(results);
                hideLoading();
            }, 600);
        }

        function analyzeInteractions() {
            const results = [];
            const normalizedNames = drugList.map(d => d.normalized);

            for (let i = 0; i < normalizedNames.length; i++) {
                for (let j = i + 1; j < normalizedNames.length; j++) {
                    const drug1 = normalizedNames[i];
                    const drug2 = normalizedNames[j];

                    const interaction = findInteraction(drug1, drug2);
                    if (interaction) {
                        results.push(Object.assign({}, interaction, {
                            drug1Name: drugList[i].original,
                            drug2Name: drugList[j].original,
                        }));
                    } else {
                        results.push({
                            drug1Name: drugList[i].original,
                            drug2Name: drugList[j].original,
                            level: 'info',
                            description: '未在数据库中找到这两种药物的已知相互作用记录。',
                            advice: '这不代表完全没有相互作用，只是暂未收录。建议服用前咨询医生或药师。',
                            interval: '建议咨询药师'
                        });
                    }
                }
            }

            const levelOrder = { 'danger': 0, 'warning': 1, 'info': 2, 'safe': 3 };
            results.sort(function(a, b) { return levelOrder[a.level] - levelOrder[b.level]; });

            return results;
        }

        function findInteraction(drug1, drug2) {
            return drugDatabase.interactions.find(function(item) {
                return (item.drugs.includes(drug1) && item.drugs.includes(drug2));
            });
        }

        function displayResults(results) {
            const section = document.getElementById('resultSection');
            
            const dangerCount = results.filter(r => r.level === 'danger').length;
            const warningCount = results.filter(r => r.level === 'warning').length;
            const safeCount = results.filter(r => r.level === 'safe').length;

            let html = '';

            if (dangerCount > 0) {
                html += '<div class="summary-card danger-summary"><h3>发现严重相互作用</h3><p>发现 ' + dangerCount + ' 组严重相互作用' + (warningCount > 0 ? '，' + warningCount + ' 组需注意' : '') + '。请仔细阅读以下建议。</p></div>';
            } else if (warningCount > 0) {
                html += '<div class="summary-card warning-summary"><h3>部分药品需注意服用间隔</h3><p>发现 ' + warningCount + ' 组需要注意的相互作用。按建议的时间间隔服用即可。</p></div>';
            } else {
                html += '<div class="summary-card safe-summary"><h3>检查结果良好</h3><p>未发现严重的药品相互作用' + (safeCount > 0 ? '，部分组合可以安全联用。' : '。但建议服用前仍咨询药师确认。') + '</p></div>';
            }

            const timelineItems = generateTimeline(results);
            if (timelineItems.length > 0) {
                html += '<div class="timeline-card"><h3>建议服用顺序与间隔</h3><div class="timeline">';
                timelineItems.forEach(function(item) {
                    html += '<div class="timeline-item">' + item + '</div>';
                });
                html += '</div></div>';
            }

            const levelLabels = {
                'danger': '严重冲突',
                'warning': '需要注意',
                'safe': '可以联用',
                'info': '未知组合'
            };

            results.forEach(function(result) {
                html += '<div class="result-item ' + result.level + '">';
                html += '<div class="result-level">' + levelLabels[result.level] + '</div>';
                html += '<div class="result-drugs">' + result.drug1Name + ' + ' + result.drug2Name + '</div>';
                html += '<div class="result-desc">' + result.description + '</div>';
                html += '<div class="result-advice"><strong>服用建议：</strong>' + result.advice + '<br><strong>间隔时间：</strong>' + result.interval + '</div>';
                html += '</div>';
            });

            section.innerHTML = html;
            section.classList.add('show');

            setTimeout(function() {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function generateTimeline(results) {
            const items = [];

            results.filter(r => r.level === 'danger').forEach(function(r) {
                items.push(r.drug1Name + ' 与 ' + r.drug2Name + '：' + r.interval);
            });

            results.filter(r => r.level === 'warning' && r.interval && r.interval.indexOf('选一种') === -1).forEach(function(r) {
                items.push(r.drug1Name + ' 与 ' + r.drug2Name + '：' + r.interval);
            });

            if (items.length === 0 && results.every(r => r.level === 'safe' || r.level === 'info')) {
                items.push('所有药品可按各自说明书时间正常服用');
            }

            return items;
        }

        function takePhoto() {
            document.getElementById('cameraInput').click();
        }

        function pickFromGallery() {
            document.getElementById('galleryInput').click();
        }

        async function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const preview = document.getElementById('ocrPreview');
            const img = document.getElementById('ocrImage');
            const ocrText = document.getElementById('ocrText');
            const ocrDrugs = document.getElementById('ocrDrugs');

            const reader = new FileReader();
            reader.onload = function(e) {
                img.src = e.target.result;
                preview.classList.add('show');
            };
            reader.readAsDataURL(file);

            ocrText.textContent = '正在识别药品信息...';
            ocrDrugs.innerHTML = '';
            showLoading('正在识别中...');

            try {
                const result = await Tesseract.recognize(file, 'chi_sim+eng', {
                    logger: function(m) {
                        if (m.status === 'recognizing text') {
                            document.getElementById('loadingText').textContent = '识别中... ' + Math.round(m.progress * 100) + '%';
                        }
                    }
                });

                hideLoading();
                const text = result.data.text;
                ocrText.textContent = '识别结果：' + text.substring(0, 200);

                const foundDrugs = matchDrugsFromText(text);
                
                if (foundDrugs.length > 0) {
                    let btns = '<span class="ocr-hint">识别到以下药品，点击添加：</span>';
                    foundDrugs.forEach(function(name) {
                        btns += '<button class="ocr-drug-btn" onclick="addDrug(\'' + name + '\')">' + name + '</button>';
                    });
                    ocrDrugs.innerHTML = btns;
                } else {
                    ocrDrugs.innerHTML = '<span class="ocr-hint">未能自动匹配到已知药品名称，请尝试手动输入</span>';
                }
            } catch (error) {
                hideLoading();
                ocrText.textContent = '识别失败，请尝试重新拍照或手动输入药品名称';
                console.error('OCR Error:', error);
            }

            event.target.value = '';
        }

        function matchDrugsFromText(text) {
            const found = [];
            const allNames = [];

            for (const [generic, brands] of Object.entries(drugDatabase.aliases)) {
                allNames.push(generic);
                brands.forEach(b => allNames.push(b));
            }

            allNames.sort(function(a, b) { return b.length - a.length; });

            for (const name of allNames) {
                if (name.length >= 2 && text.includes(name) && !found.includes(name)) {
                    found.push(name);
                }
            }

            return found.slice(0, 5);
        }

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || '处理中...';
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(45,45,45,0.88);color:white;padding:14px 28px;border-radius:24px;font-size:14px;z-index:9999;letter-spacing:0.5px;font-weight:300;';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 2000);
        }

        document.getElementById('drugInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addDrug();
            }
        });
    </script>
</body>
</html>

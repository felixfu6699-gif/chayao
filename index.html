<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>药品相互作用查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 16px 24px;
            color: white;
            text-align: center;
            box-shadow: 0 2px 12px rgba(102, 126, 234, 0.3);
        }

        .header h1 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header p {
            font-size: 12px;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .input-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title .icon {
            font-size: 18px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .drug-input {
            flex: 1;
            height: 44px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .drug-input:focus {
            border-color: #667eea;
        }

        .btn-add {
            height: 44px;
            padding: 0 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-add:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .camera-section {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-camera, .btn-gallery {
            flex: 1;
            height: 44px;
            border: 1.5px dashed #d1d5db;
            border-radius: 12px;
            background: #fafbfc;
            color: #6b7280;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-camera:active, .btn-gallery:active {
            background: #f0f0f5;
            border-color: #667eea;
            color: #667eea;
        }

        .drug-list-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .drug-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 40px;
        }

        .drug-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #f0f3ff 0%, #f8f0ff 100%);
            border: 1px solid #e0e4ff;
            border-radius: 20px;
            font-size: 14px;
            color: #4c5680;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .drug-tag .remove {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #d1d5db;
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
        }

        .drug-tag .remove:active {
            background: #ef4444;
        }

        .empty-hint {
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
            padding: 12px 0;
        }

        .btn-check {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-check:active {
            transform: scale(0.97);
        }

        .btn-check:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-item {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item.danger {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .result-item.warning {
            background: #fffbeb;
            border: 1px solid #fed7aa;
        }

        .result-item.safe {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .result-item.info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .result-level {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-item.danger .result-level { color: #dc2626; }
        .result-item.warning .result-level { color: #d97706; }
        .result-item.safe .result-level { color: #16a34a; }
        .result-item.info .result-level { color: #2563eb; }

        .result-drugs {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .result-desc {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.6;
        }

        .result-advice {
            margin-top: 8px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
            font-size: 13px;
            color: #374151;
            line-height: 1.6;
        }

        .result-advice strong {
            color: #667eea;
        }

        .disclaimer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            padding: 20px 16px;
            line-height: 1.6;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-box {
            background: white;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: #6b7280;
        }

        .ocr-preview {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .ocr-preview.show {
            display: block;
        }

        .ocr-preview img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .ocr-result-text {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }

        .ocr-drugs-found {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ocr-drug-btn {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .ocr-drug-btn:active {
            opacity: 0.8;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            color: white;
        }

        .summary-card h3 {
            font-size: 15px;
            margin-bottom: 8px;
            opacity: 0.95;
        }

        .summary-card p {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .timeline {
            margin-top: 12px;
            padding-left: 16px;
            border-left: 2px solid rgba(255,255,255,0.3);
        }

        .timeline-item {
            position: relative;
            padding: 8px 0 8px 16px;
            font-size: 14px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -21px;
            top: 14px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💊 药品相互作用查询</h1>
        <p>查询药品是否能一起吃，了解安全服用间隔</p>
    </div>

    <div class="container">
        <div class="input-section">
            <div class="section-title">
                <span class="icon">✏️</span> 输入药品名称
            </div>
            <div class="input-row">
                <input type="text" class="drug-input" id="drugInput" placeholder="输入药品名称，如：布洛芬" />
                <button class="btn-add" onclick="addDrug()">添加</button>
            </div>
            <div class="camera-section">
                <button class="btn-camera" onclick="takePhoto()">
                    📷 拍照识别
                </button>
                <button class="btn-gallery" onclick="pickFromGallery()">
                    🖼️ 相册选取
                </button>
            </div>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)" />
            <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleImage(event)" />
            
            <div class="ocr-preview" id="ocrPreview">
                <img id="ocrImage" src="" alt="拍照预览" />
                <div class="ocr-result-text" id="ocrText">正在识别中...</div>
                <div class="ocr-drugs-found" id="ocrDrugs"></div>
            </div>
        </div>

        <div class="drug-list-section">
            <div class="section-title">
                <span class="icon">📋</span> 已添加药品
            </div>
            <div class="drug-tags" id="drugTags">
                <div class="empty-hint">请添加至少2种药品进行查询</div>
            </div>
        </div>

        <button class="btn-check" id="btnCheck" onclick="checkInteractions()" disabled>
            🔍 查询药品相互作用
        </button>

        <div class="result-section" id="resultSection">
        </div>

        <div class="disclaimer">
            ⚠️ 本工具仅供参考，不能替代医生或药师的专业建议。<br>
            服用多种药品前请咨询医师或药师。
        </div>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">正在分析中...</div>
        </div>
    </div>

        // ==================== 核心逻辑 ====================
        let drugList = [];

        function normalizeDrugName(name) {
            name = name.trim();
            if (drugDatabase.aliases[name] !== undefined) {
                return name;
            }
            for (const [generic, brands] of Object.entries(drugDatabase.aliases)) {
                if (brands.some(b => name.includes(b) || b.includes(name))) {
                    return generic;
                }
                if (name.includes(generic)) {
                    return generic;
                }
            }
            return name;
        }

        function addDrug(name) {
            const input = document.getElementById('drugInput');
            const drugName = name || input.value.trim();
            
            if (!drugName) return;
            
            const normalized = normalizeDrugName(drugName);
            
            if (drugList.some(d => d.normalized === normalized)) {
                showToast('该药品已添加');
                input.value = '';
                return;
            }

            drugList.push({
                original: drugName,
                normalized: normalized
            });

            input.value = '';
            renderDrugTags();
            updateCheckButton();
        }

        function removeDrug(index) {
            drugList.splice(index, 1);
            renderDrugTags();
            updateCheckButton();
            // 如果药品不够，隐藏结果
            if (drugList.length < 2) {
                document.getElementById('resultSection').classList.remove('show');
            }
        }

        function renderDrugTags() {
            const container = document.getElementById('drugTags');
            if (drugList.length === 0) {
                container.innerHTML = '<div class="empty-hint">请添加至少2种药品进行查询</div>';
                return;
            }

            container.innerHTML = drugList.map((drug, index) => {
                const showAlias = drug.original !== drug.normalized;
                return `
                    <div class="drug-tag">
                        ${drug.original}${showAlias ? `<span style="font-size:11px;color:#9ca3af">(${drug.normalized})</span>` : ''}
                        <span class="remove" onclick="removeDrug(${index})">✕</span>
                    </div>
                `;
            }).join('');
        }

        function updateCheckButton() {
            const btn = document.getElementById('btnCheck');
            btn.disabled = drugList.length < 2;
        }

        function checkInteractions() {
            if (drugList.length < 2) return;

            showLoading('正在分析药品相互作用...');

            setTimeout(() => {
                const results = analyzeInteractions();
                displayResults(results);
                hideLoading();
            }, 600);
        }

        function analyzeInteractions() {
            const results = [];
            const normalizedNames = drugList.map(d => d.normalized);

            for (let i = 0; i < normalizedNames.length; i++) {
                for (let j = i + 1; j < normalizedNames.length; j++) {
                    const drug1 = normalizedNames[i];
                    const drug2 = normalizedNames[j];

                    const interaction = findInteraction(drug1, drug2);
                    if (interaction) {
                        results.push({
                            ...interaction,
                            drug1Name: drugList[i].original,
                            drug2Name: drugList[j].original,
                        });
                    } else {
                        results.push({
                            drug1Name: drugList[i].original,
                            drug2Name: drugList[j].original,
                            level: 'info',
                            description: '未在数据库中找到这两种药物的已知相互作用记录。',
                            advice: '这不代表完全没有相互作用，只是暂未收录。建议服用前咨询医生或药师。',
                            interval: '建议咨询药师'
                        });
                    }
                }
            }

            const levelOrder = { 'danger': 0, 'warning': 1, 'info': 2, 'safe': 3 };
            results.sort((a, b) => levelOrder[a.level] - levelOrder[b.level]);

            return results;
        }

        function findInteraction(drug1, drug2) {
            return drugDatabase.interactions.find(item => {
                return (item.drugs.includes(drug1) && item.drugs.includes(drug2));
            });
        }

        function displayResults(results) {
            const section = document.getElementById('resultSection');
            
            const dangerCount = results.filter(r => r.level === 'danger').length;
            const warningCount = results.filter(r => r.level === 'warning').length;
            const safeCount = results.filter(r => r.level === 'safe').length;

            let html = '';

            // 总结卡片
            if (dangerCount > 0) {
                html += `<div class="summary-card" style="background: linear-gradient(135deg, #dc2626 0%, #9f1239 100%);">
                    <h3>⚠️ 发现严重相互作用</h3>
                    <p>在您添加的药品中，发现 ${dangerCount} 组严重相互作用${warningCount > 0 ? `，${warningCount} 组需注意的相互作用` : ''}。请仔细阅读以下建议。</p>
                </div>`;
            } else if (warningCount > 0) {
                html += `<div class="summary-card" style="background: linear-gradient(135deg, #d97706 0%, #b45309 100%);">
                    <h3>⚡ 部分药品需注意服用间隔</h3>
                    <p>发现 ${warningCount} 组需要注意的相互作用。按建议的时间间隔服用即可。</p>
                </div>`;
            } else {
                html += `<div class="summary-card">
                    <h3>✅ 检查结果良好</h3>
                    <p>未发现严重的药品相互作用${safeCount > 0 ? '，部分组合可以安全联用。' : '。但建议服用前仍咨询药师确认。'}</p>
                </div>`;
            }

            // 建议服用顺序
            const timelineItems = generateTimeline(results);
            if (timelineItems.length > 0) {
                html += `<div class="summary-card">
                    <h3>⏰ 建议服用顺序与间隔</h3>
                    <div class="timeline">
                        ${timelineItems.map(item => `
                            <div class="timeline-item">${item}</div>
                        `).join('')}
                    </div>
                </div>`;
            }

            // 详细结果
            const levelLabels = {
                'danger': '🚫 严重冲突',
                'warning': '⚡ 需要注意',
                'safe': '✅ 可以联用',
                'info': 'ℹ️ 未知组合'
            };

            html += results.map(result => `
                <div class="result-item ${result.level}">
                    <div class="result-level">${levelLabels[result.level]}</div>
                    <div class="result-drugs">${result.drug1Name} + ${result.drug2Name}</div>
                    <div class="result-desc">${result.description}</div>
                    <div class="result-advice">
                        <strong>服用建议：</strong>${result.advice}<br>
                        <strong>间隔时间：</strong>${result.interval}
                    </div>
                </div>
            `).join('');

            section.innerHTML = html;
            section.classList.add('show');

            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function generateTimeline(results) {
            const items = [];

            const dangerPairs = results.filter(r => r.level === 'danger');
            dangerPairs.forEach(r => {
                items.push(`🚫 ${r.drug1Name} 与 ${r.drug2Name}：${r.interval}`);
            });

            const warningPairs = results.filter(r => r.level === 'warning' && r.interval && !r.interval.includes('选一种'));
            warningPairs.forEach(r => {
                items.push(`⚡ ${r.drug1Name} 与 ${r.drug2Name}：${r.interval}`);
            });

            if (items.length === 0 && results.every(r => r.level === 'safe' || r.level === 'info')) {
                items.push('所有药品可按各自说明书时间正常服用');
            }

            return items;
        }

        // ==================== 拍照识别 ====================
        function takePhoto() {
            document.getElementById('cameraInput').click();
        }

        function pickFromGallery() {
            document.getElementById('galleryInput').click();
        }

        async function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const preview = document.getElementById('ocrPreview');
            const img = document.getElementById('ocrImage');
            const ocrText = document.getElementById('ocrText');
            const ocrDrugs = document.getElementById('ocrDrugs');

            const reader = new FileReader();
            reader.onload = function(e) {
                img.src = e.target.result;
                preview.classList.add('show');
            };
            reader.readAsDataURL(file);

            ocrText.textContent = '正在识别药品信息...';
            ocrDrugs.innerHTML = '';
            showLoading('正在OCR识别中...');

            try {
                const result = await Tesseract.recognize(file, 'chi_sim+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            document.getElementById('loadingText').textContent = 
                                `识别中... ${Math.round(m.progress * 100)}%`;
                        }
                    }
                });

                hideLoading();
                const text = result.data.text;
                ocrText.textContent = '识别结果：' + text.substring(0, 200);

                const foundDrugs = matchDrugsFromText(text);
                
                if (foundDrugs.length > 0) {
                    ocrDrugs.innerHTML = '<span style="font-size:12px;color:#6b7280;display:block;margin-bottom:6px;">识别到以下药品，点击添加：</span>' +
                        foundDrugs.map(name => 
                            `<button class="ocr-drug-btn" onclick="addDrug('${name}')">${name}</button>`
                        ).join('');
                } else {
                    ocrDrugs.innerHTML = '<span style="font-size:12px;color:#9ca3af;">未能自动匹配到已知药品名称，请尝试手动输入</span>';
                }
            } catch (error) {
                hideLoading();
                ocrText.textContent = '识别失败，请尝试重新拍照或手动输入药品名称';
                console.error('OCR Error:', error);
            }

            event.target.value = '';
        }

        function matchDrugsFromText(text) {
            const found = [];
            const allNames = [];

            for (const [generic, brands] of Object.entries(drugDatabase.aliases)) {
                allNames.push(generic);
                brands.forEach(b => allNames.push(b));
            }

            allNames.sort((a, b) => b.length - a.length);

            for (const name of allNames) {
                if (name.length >= 2 && text.includes(name) && !found.includes(name)) {
                    found.push(name);
                }
            }

            return found.slice(0, 5);
        }

        // ==================== 工具函数 ====================
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || '处理中...';
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:white;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // Enter键添加
        document.getElementById('drugInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addDrug();
            }
        });
    </script>
</body>
</html>
